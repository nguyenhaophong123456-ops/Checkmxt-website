<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HIHI MXT - Phân Quyền Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d0f18; color: #fff; padding: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .locked { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .badge-pro { background: #f39c12; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .badge-plus { background: #8957e5; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        #adminPanel { display: none; background: #1c2128; padding: 15px; border-radius: 12px; border: 1px solid #a259ff; margin-bottom: 20px; }
        .btn-main { width: 100%; padding: 12px; background: #a259ff; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <button onclick="moAdmin()" style="background:none; border:none; color:#a259ff; cursor:pointer;">⚙️ Admin Panel</button>

    <div id="adminPanel">
        <h3>🛠️ Bảng Quyền Admin</h3>
        <input type="text" id="targetUser" placeholder="Nhập UID..." style="width:100%; padding:8px; margin:10px 0;">
        <select id="packageType" style="width:100%; padding:8px;">
            <option value="PRO">Cấp riêng PRO</option>
            <option value="PLUS">Cấp riêng PLUS</option>
            <option value="BOTH">Cấp cả PRO & PLUS</option>
            <option value="RESET">Thu hồi toàn bộ (Reset)</option>
        </select>
        <button class="btn-main" onclick="capQuyen()">Xác Nhận Cấp Quyền</button>
    </div>

    <div class="section-title">Danh Sách Tính Năng</div>
    <div class="card pro-feature locked" onclick="dungChucNang('PRO')">
        <div>Ban 7 Ngày <span class="badge-pro">PRO</span></div>
    </div>
    <div class="card plus-feature locked" onclick="dungChucNang('PLUS')">
        <div>Chặn OTP <span class="badge-plus">PLUS</span></div>
    </div>

    <script>
        let hasPro = false;
        let hasPlus = false;

        function moAdmin() {
            let p = prompt("Mật khẩu:");
            if(p === "Maiyeuvu12345") document.getElementById('adminPanel').style.display = 'block';
        }

        function capQuyen() {
            let pkg = document.getElementById('packageType').value;
            let proItems = document.querySelectorAll('.pro-feature');
            let plusItems = document.querySelectorAll('.plus-feature');

            // Reset trạng thái trước khi cấp mới
            hasPro = false;
            hasPlus = false;
            proItems.forEach(el => el.classList.add('locked'));
            plusItems.forEach(el => el.classList.add('locked'));

            // Logic cấp quyền
            if (pkg === 'PRO' || pkg === 'BOTH') {
                hasPro = true;
                proItems.forEach(el => el.classList.remove('locked'));
            }
            if (pkg === 'PLUS' || pkg === 'BOTH') {
                hasPlus = true;
                plusItems.forEach(el => el.classList.remove('locked'));
            }

            alert("Đã cấp quyền: " + pkg);
        }

        function dungChucNang(loai) {
            if (loai === 'PRO' && !hasPro) { alert("Bạn cần quyền PRO!"); return; }
            if (loai === 'PLUS' && !hasPlus) { alert("Bạn cần quyền PLUS!"); return; }
            alert("Đang thực hiện tính năng " + loai + "...");
        }
    </script>
</body>
</html>
