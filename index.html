<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIHI MXT | NỀN TẢNG QUẢN TRỊ TÀI KHOẢN ĐỘC QUYỀN</title>
    <style>
        :root { --main-color: #a259ff; --bg-dark: #050505; --panel-bg: #111; --text-color: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-color); padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-color); padding-bottom: 15px; margin-bottom: 20px; }
        .badge { background: var(--main-color); color: #fff; padding: 2px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        
        /* Dashboard Grid */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        h3 { color: var(--main-color); margin-bottom: 15px; font-size: 16px; text-transform: uppercase; }
        
        /* Inputs & Buttons */
        .input-field { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 10px; }
        .btn-action { width: 100%; padding: 12px; background: var(--main-color); border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-action:hover { opacity: 0.8; }
        
        /* Logs */
        .log-container { background: #000; color: #0f0; font-family: monospace; padding: 15px; height: 200px; overflow-y: auto; border: 1px solid #222; border-radius: 6px; font-size: 12px; }
        
        /* Utility */
        .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>HIHI MXT <span style="font-size: 14px; color: #666;">V3.0.4 PRO</span></h1>
        </div>
        <div>
            <span id="status" class="badge">SYSTEM READY</span>
        </div>
    </div>

    <div class="dashboard">
        <!-- Input Panel -->
        <div class="panel">
            <h3>Truy xuất tài nguyên</h3>
            <input type="text" id="tokenIn" class="input-field" placeholder="Nhập Token hoặc UID hệ thống...">
            <button class="btn-action" onclick="execute('ANALYZING')">Phân tích hệ thống</button>
            <button class="btn-action" style="background: #333;" onclick="execute('VALIDATE')">Xác thực quyền hạn</button>
        </div>

        <!-- System Stats -->
        <div class="panel">
            <h3>Thông số kỹ thuật</h3>
            <p>Phiên bản API: 5.2.1 | Enc: AES-256</p>
            <p>Trạng thái kết nối: <span style="color: #0f0;">Đã kết nối</span></p>
            <p>Quyền truy cập: <span class="badge" id="roleBadge">FREE_USER</span></p>
            <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
            <button class="btn-action" onclick="loginPanel()" style="background: #238636;">Nâng cấp VIP (PRO)</button>
        </div>
    </div>

    <!-- Features -->
    <div class="panel" style="margin-top: 20px;">
        <h3>Module can thiệp & Bảo mật</h3>
        <div class="feature-grid">
            <button class="btn-action" onclick="execute('BRUTE')">Dò mã bảo mật 100%</button>
            <button class="btn-action" onclick="execute('BAN_PERM')">Ban Vĩnh Viễn (BotTCP)</button>
            <button class="btn-action" onclick="execute('BLOCK_OTP')">Chặn Mail Xác Thực</button>
            <button class="btn-action" onclick="execute('UNLINK_FB')">Gỡ Liên Kết FB</button>
        </div>
    </div>

    <!-- Logs -->
    <div class="panel" style="margin-top: 20px;">
        <h3>Nhật ký thực thi thời gian thực</h3>
        <div class="log-container" id="logs">
            [SYSTEM] Khởi tạo môi trường...<br>
        </div>
    </div>
</div>

<script>
    function addLog(msg) {
        const logs = document.getElementById('logs');
        const time = new Date().toLocaleTimeString();
        logs.innerHTML += `[${time}] ${msg}<br>`;
        logs.scrollTop = logs.scrollHeight;
    }

    function execute(action) {
        const token = document.getElementById('tokenIn').value;
        if (!token) { addLog("[ERROR] Vui lòng nhập Token/UID!"); return; }
        
        addLog(`[ACTION] Kích hoạt lệnh: ${action}...`);
        setTimeout(() => addLog(`[SUCCESS] Lệnh ${action} đã được đẩy tới máy chủ!`), 1000);
    }

    function loginPanel() {
        const p = prompt("Nhập mã kích hoạt VIP:");
        if (p === "HIHI") {
            document.getElementById('roleBadge').innerText = "PRO_ACCESS";
            addLog("[SYSTEM] Chúc mừng! Quyền PRO đã được kích hoạt.");
        }
    }
</script>

</body>
</html>
