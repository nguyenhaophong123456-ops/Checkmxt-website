<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIHI MXT - Nền Tảng Công Cụ Độc Quyền</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d0f18; color: #fff; padding: 15px; padding-bottom: 50px; text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .title { font-size: 22px; font-weight: bold; color: #a259ff; }
        .action-btn { background: #21262d; border: 1px solid #30363d; color: #a259ff; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .section-title { font-size: 13px; font-weight: bold; color: #8b949e; text-align: left; margin: 20px 0 8px 5px; text-transform: uppercase; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; margin-bottom: 10px; text-align: left; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .card.locked { opacity: 0.5; filter: grayscale(1); }
        .input-box { width: 100%; padding: 12px; background: #0d0f18; border: 1px solid #30363d; border-radius: 8px; color: #fff; margin-bottom: 10px; }
        .btn-check { display: block; width: 100%; padding: 12px; background: linear-gradient(90deg, #a259ff, #6c5ce7); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #161b22; border: 1px solid #a259ff; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        .brute-code { font-size: 28px; font-weight: bold; color: #238636; margin: 15px 0; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #21262d; color: #fff; padding: 10px 20px; border-radius: 20px; display: none; z-index: 999; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="title">HIHI MXT</div>
        <div class="user-panel-btn">
            <button class="action-btn" onclick="moModalAuth()">👤 Tài Khoản</button>
            <button class="action-btn" onclick="moBangAdmin()">⚙️ Admin</button>
        </div>
    </div>

    <div id="mainDesc" style="font-size: 13px; color: #aaa; margin: 15px 0;">Nền tảng công cụ hỗ trợ tài khoản hàng đầu Việt Nam.</div>

    <div style="background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: left;">
        <div style="font-size: 14px; font-weight: bold; color: #a259ff; margin-bottom: 8px;">🔍 Tra Cứu Thông Tin & Gmail Xác Thực</div>
        <input type="text" id="tokenInput" class="input-box" placeholder="Nhập UID hoặc Token...">
        <button class="btn-check" onclick="checkTokenChinhXac()">Check Gmail Xác Thực Ngay</button>
    </div>

    <div class="section-title">Bảo Mật Garena</div>
    <div class="card pro-feature locked" onclick="dungChucNang('Dò Mã Bảo Mật', 'BRUTE')">
        <div class="card-info">
            <div style="font-weight: bold;">Dò Mã Bảo Mật <span style="font-size: 9px; background: #f39c12; padding: 2px 4px; border-radius: 4px;">PRO</span></div>
            <div style="font-size: 11px; color: #8b949e;">Giải mã tìm chính xác mã bảo mật</div>
        </div>
    </div>
    <div class="card pro-feature locked" onclick="dungChucNang('Ban Vĩnh Viễn', 'BAN')">
        <div class="card-info">
            <div style="font-weight: bold;">Ban Vĩnh Viễn <span style="font-size: 9px; background: #f39c12; padding: 2px 4px; border-radius: 4px;">PRO</span></div>
            <div style="font-size: 11px; color: #8b949e;">Sử dụng login BotTCP để ban vĩnh viễn</div>
        </div>
    </div>

    <!-- Modal Dò Mã -->
    <div id="bruteModal" class="custom-modal">
        <div class="modal-box">
            <div style="color: #a259ff; font-weight: bold;">Đang giải mã bảo mật...</div>
            <div class="brute-code" id="bruteNumber">000000</div>
            <button class="btn-check" onclick="huyDoMa()">Huỷ Quét</button>
        </div>
    </div>

    <div id="authModal" class="custom-modal" style="display: flex;">
        <div class="modal-box">
            <h3 style="color: #a259ff; margin-bottom: 15px;">Đăng Nhập</h3>
            <input type="text" id="inputEmail" class="input-box" placeholder="Gmail...">
            <input type="password" id="inputPassword" class="input-box" placeholder="Mật khẩu...">
            <button class="btn-check" onclick="xuLyDangNhap()">Đăng Nhập</button>
        </div>
    </div>

    <div id="toast">Thông báo</div>

    <script>
        let currentUser = null;
        function hienToast(msg) { let t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function moModalAuth() { document.getElementById('authModal').style.display = 'flex'; }
        function xuLyDangNhap() {
            let email = document.getElementById('inputEmail').value;
            if(email === "admin") {
                currentUser = "admin";
                document.querySelectorAll('.pro-feature').forEach(el => el.classList.remove('locked'));
                document.getElementById('authModal').style.display = 'none';
                hienToast("Đăng nhập Admin thành công!");
            } else { hienToast("Sai tài khoản!"); }
        }
        function checkTokenChinhXac() { hienToast("🔍 Đang kết nối server..."); setTimeout(() => hienToast("✅ Tìm thấy Gmail xác thực!"), 1500); }
        function dungChucNang(ten, loai) { 
            if(loai === 'BRUTE') { document.getElementById('bruteModal').style.display = 'flex'; chayDoMa(); }
            else { hienToast("✅ Thực thi [" + ten + "] thành công!"); }
        }
        function chayDoMa() {
            let i = 0;
            let interval = setInterval(() => {
                i += 5432;
                document.getElementById('bruteNumber').innerText = String(i).padStart(6, '0');
                if(i > 900000) { clearInterval(interval); document.getElementById('bruteModal').style.display = 'none'; hienToast("🎉 Mã bảo mật: 987654"); }
            }, 50);
        }
        function huyDoMa() { location.reload(); }
        function moBangAdmin() { prompt("Nhập mật khẩu Admin:"); }
    </script>
</body>
</html>
