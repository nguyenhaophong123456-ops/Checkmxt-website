<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIHI MXT - Nền Tảng Công Cụ Hoàn Chỉnh</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0f18; color: #fff; padding: 15px; padding-bottom: 60px; text-align: center; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .title { font-size: 22px; font-weight: bold; color: #a259ff; }
        .admin-btn { background: #21262d; border: 1px solid #30363d; color: #a259ff; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        .desc { font-size: 13px; color: #aaa; margin-bottom: 20px; line-height: 1.4; padding: 0 5px; text-align: left; }
        
        .section-title { font-size: 13px; font-weight: bold; color: #8b949e; text-align: left; margin: 20px 0 8px 5px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .section-title span { font-size: 11px; background: #21262d; padding: 2px 8px; border-radius: 10px; color: #c9d1d9; }
        
        /* Style nút chung */
        .card-btn { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; margin-bottom: 10px; text-align: left; display: flex; align-items: center; justify-content: space-between; color: #fff; }
        
        /* Nút FREE sáng rõ, bấm mượt */
        .card-btn:not(:disabled) { cursor: pointer; }
        .card-btn:not(:disabled):active { background: #30363d; border-color: #a259ff; }

        /* Nút PRO và PLUS bị làm mờ và khóa lại */
        .card-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #11141a; border-color: #21262d; }

        .card-info { flex: 1; pointer-events: none; text-align: left; }
        .card-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
        .card-desc { font-size: 11px; color: #8b949e; line-height: 1.3; }
        
        .badge-pro { background: linear-gradient(90deg, #f39c12, #e67e22); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        .badge-free { background: #238636; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        .badge-plus { background: #8957e5; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        
        .input-box { width: 100%; padding: 12px; background: #0d0f18; border: 1px solid #30363d; border-radius: 8px; color: #fff; margin-bottom: 10px; font-size: 14px; outline: none; }
        .select-box { width: 100%; padding: 12px; background: #0d0f18; border: 1px solid #30363d; border-radius: 8px; color: #fff; margin-bottom: 10px; font-size: 14px; outline: none; }
        .btn-check { display: block; width: 100%; padding: 12px; background: linear-gradient(90deg, #a259ff, #6c5ce7); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 5px; }
        .arrow { color: #8b949e; font-size: 16px; font-weight: bold; padding-left: 8px; pointer-events: none; }

        #adminPanel { display: none; text-align: left; background: #161b22; border: 1px solid #a259ff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(162, 89, 255, 0.2); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        .btn-close { background: #da3633; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .admin-divider { border-top: 1px solid #30363d; margin: 15px 0; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #21262d; color: #fff; border: 1px solid #a259ff; padding: 12px 24px; border-radius: 25px; font-size: 14px; display: none; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.6); font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="title">HIHI MXT</div>
        <button class="admin-btn" id="openAdminBtn">⚙️ Admin Panel</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel">
        <div class="admin-header">
            <div style="font-size: 15px; font-weight: bold; color: #a259ff;">🛠️ Bảng Quản Trị Admin</div>
            <button class="btn-close" id="closeAdminBtn">Đóng</button>
        </div>
        
        <div style="font-size: 13px; color: #c9d1d9; margin-bottom: 6px;">Cập nhật thông báo trang chủ:</div>
        <input type="text" class="input-box" id="announcementInput" placeholder="Nhập thông báo mới...">
        <button class="btn-check" style="margin-bottom: 10px;" id="changeNoticeBtn">Đổi Thông Báo</button>

        <div class="admin-divider"></div>

        <div style="font-size: 13px; font-weight: bold; color: #a259ff; margin-bottom: 6px;">⚡ Cấp Quyền Cho Tài Khoản</div>
        <input type="text" class="input-box" id="targetUser" placeholder="Nhập chính xác UID hoặc Token...">
        <select class="select-box" id="packageType">
            <option value="PRO">Cấp riêng PRO</option>
            <option value="PLUS">Cấp riêng PLUS</option>
            <option value="BOTH">Cấp cả PRO & PLUS</option>
            <option value="RESET">Hạ về FREE (Thu hồi)</option>
        </select>
        <button class="btn-check" id="setPermBtn">Xác Nhận Cấp Quyền</button>
    </div>

    <div class="desc" id="mainDesc">Nền tảng công cụ hỗ trợ tài khoản hàng đầu Việt Nam. Bảo mật và tốc độ cao.</div>

    <!-- TRA CỨU -->
    <div style="background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: left;">
        <div style="font-size: 14px; font-weight: bold; color: #a259ff; margin-bottom: 8px;">🔍 Tra Cứu Thông Tin Acc</div>
        <input type="text" id="tokenInput" class="input-box" placeholder="Nhập UID hoặc Token (EAT/JWT)...">
        <button class="btn-check" id="checkTokenBtn">Check Ngay</button>
    </div>

    <!-- DANH SÁCH CHỨC NĂNG (PRO & PLUS bị mờ/disabled, FREE sáng rõ) -->
    <div class="section-title">Phổ Biến <span>2</span></div>
    <button class="card-btn" data-name="Ban 7 Ngày" data-type="PRO" disabled><div class="card-info"><div class="card-title">Ban 7 Ngày <span class="badge-pro">PRO</span></div><div class="card-desc">Ban tài khoản đó trong vòng 7 ngày</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Tiểu Sử Dài" data-type="PRO" disabled><div class="card-info"><div class="card-title">Tiểu Sử Dài <span class="badge-pro">PRO</span></div><div class="card-desc">Đặt tiểu sử dài cho tài khoản cấp tốc</div></div><div class="arrow">›</div></button>

    <div class="section-title">Quản Lý Token <span>4</span></div>
    <button class="card-btn" data-name="Vô Hiệu Hoá Access Token" data-type="PRO" disabled><div class="card-info"><div class="card-title">Vô Hiệu Hoá Access Token <span class="badge-pro">PRO</span></div><div class="card-desc">Vô hiệu hoá access token hiện tại ngay lập tức</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="EAT → Access Token" data-type="PRO" disabled><div class="card-info"><div class="card-title">EAT → Access Token <span class="badge-pro">PRO</span></div><div class="card-desc">Chuyển đổi EAT token sang Access Token</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="EAT → JWT Token" data-type="PRO" disabled><div class="card-info"><div class="card-title">EAT → JWT Token <span class="badge-pro">PRO</span></div><div class="card-desc">Chuyển đổi EAT Token sang JWT Token</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Access Token → JWT Token" data-type="FREE"><div class="card-info"><div class="card-title">Access Token → JWT Token <span class="badge-free">FREE</span></div><div class="card-desc">Chuyển đổi Access Token sang JWT Token</div></div><div class="arrow">›</div></button>

    <div class="section-title">Quản Lý Email <span>4</span></div>
    <button class="card-btn" data-name="Thêm Email Khôi Phục" data-type="PRO_EMAIL" disabled><div class="card-info"><div class="card-title">Thêm Email Khôi Phục <span class="badge-pro">PRO</span></div><div class="card-desc">Thêm email khôi phục (Quy trình 3 bước tự động)</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Huỷ Yêu Cầu Gắn Email" data-type="PRO" disabled><div class="card-info"><div class="card-title">Huỷ Yêu Cầu Gắn Email <span class="badge-pro">PRO</span></div><div class="card-desc">Huỷ yêu cầu gắn email khôi phục đang chờ</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Huỷ Liên Kết Email" data-type="FREE"><div class="card-info"><div class="card-title">Huỷ Liên Kết Email <span class="badge-free">FREE</span></div><div class="card-desc">Gỡ email liên kết khỏi tài khoản</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Đổi Email Liên Kết" data-type="FREE"><div class="card-info"><div class="card-title">Đổi Email Liên Kết <span class="badge-free">FREE</span></div><div class="card-desc">Thay đổi email liên kết của bạn</div></div><div class="arrow">›</div></button>

    <div class="section-title">Bảo Mật Garena <span>2</span></div>
    <button class="card-btn" data-name="Dò Mã Bảo Mật" data-type="BRUTE" disabled><div class="card-info"><div class="card-title">Dò Mã Bảo Mật <span class="badge-pro">PRO</span></div><div class="card-desc">Dò mã bảo mật mail xác thực từ 000000 đến 999999</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Ban Vĩnh Viễn" data-type="PRO" disabled><div class="card-info"><div class="card-title">Ban Vĩnh Viễn <span class="badge-pro">PRO</span></div><div class="card-desc">Sử dụng login BotTCP để ban vĩnh viễn</div></div><div class="arrow">›</div></button>

    <div class="section-title">Tính Năng Plus & Pro <span>3</span></div>
    <button class="card-btn" data-name="Spam Log" data-type="PRO" disabled><div class="card-info"><div class="card-title">Spam Log <span class="badge-pro">PRO</span></div><div class="card-desc">Chạy ngầm Spam Log trong game</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Chặn Mail Xác Thực (OTP)" data-type="PLUS" disabled><div class="card-info"><div class="card-title">Chặn Mail Xác Thực (OTP) <span class="badge-plus">PLUS</span></div><div class="card-desc">Nhập gmail muốn chặn mã xác thực</div></div><div class="arrow">›</div></button>
    <button class="card-btn" data-name="Đăng Xuất Mọi Thiết Bị" data-type="PLUS" disabled><div class="card-info"><div class="card-title">Đăng Xuất Mọi Thiết Bị <span class="badge-plus">PLUS</span></div><div class="card-desc">Đăng xuất toàn bộ thiết bị đang đăng nhập</div></div><div class="arrow">›</div></button>

    <div id="toast">Thông báo</div>

    <script>
        function hienToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('openAdminBtn').addEventListener('click', function() {
                let pass = prompt("🔐 Nhập mật khẩu quản trị Admin:");
                if (pass === "Maiyeuvu12345") {
                    document.getElementById('adminPanel').style.display = 'block';
                    hienToast("Đăng nhập Admin thành công!");
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else if (pass !== null) {
                    hienToast("❌ Mật khẩu Admin không đúng!");
                }
            });

            document.getElementById('closeAdminBtn').addEventListener('click', function() {
                document.getElementById('adminPanel').style.display = 'none';
            });

            document.getElementById('changeNoticeBtn').addEventListener('click', function() {
                let text = document.getElementById('announcementInput').value.trim();
                if(text !== "") {
                    document.getElementById('mainDesc').innerText = text;
                    hienToast("Đã cập nhật thông báo hệ thống!");
                } else {
                    hienToast("Vui lòng nhập nội dung thông báo mới!");
                }
            });

            document.getElementById('checkTokenBtn').addEventListener('click', async function() {
                let val = document.getElementById('tokenInput').value.trim();
                if(val === "") {
                    hienToast("⚠️ Vui lòng nhập UID hoặc Token trước!");
                    return;
                }
                try {
                    let res = await fetch('/api/check-user/' + encodeURIComponent(val));
                    let data = await res.json();
                    hienToast(`✅ Tài khoản: ${data.uid} - Gói: ${data.package}`);
                } catch (e) {
                    hienToast("❌ Lỗi kết nối đến server!");
                }
            });

            document.getElementById('setPermBtn').addEventListener('click', async function() {
                let user = document.getElementById('targetUser').value.trim();
                let pkg = document.getElementById('packageType').value;
                if(user === "") {
                    hienToast("❌ Vui lòng nhập UID hoặc Token cần cấp!");
                    return;
                }
                try {
                    let response = await fetch('/api/admin/set-permission', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ adminPass: "Maiyeuvu12345", targetUser: user, packageType: pkg })
                    });
                    let data = await response.json();
                    hienToast(data.message);
                    if(data.success) document.getElementById('targetUser').value = "";
                } catch (error) {
                    hienToast("❌ Lỗi kết nối đến server!");
                }
            });

            // Gắn sự kiện click cho các nút không bị disable (FREE)
            const buttons = document.querySelectorAll('.card-btn:not(:disabled)');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    let tenChucNang = this.getAttribute('data-name');
                    
                    if (tenChucNang === 'Huỷ Liên Kết Email' || tenChucNang === 'Đổi Email Liên Kết') {
                        let mail = prompt("Nhập email mới hoặc xác nhận thao tác:");
                        if (!mail) return;
                        hienToast("Đang xử lý liên kết email...");
                        setTimeout(() => hienToast("✅ Thao tác email thành công!"), 2000);
                        return;
                    }

                    hienToast("Đang xử lý " + tenChucNang + "...");
                    setTimeout(() => hienToast("✅ Thực thi thành công [" + tenChucNang + "]!"), 2000);
                });
            });
        });
    </script>
</body>
</html>
